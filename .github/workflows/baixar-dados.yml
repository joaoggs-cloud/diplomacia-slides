# A sessão do Claude não alcança sites oficiais (Tesouro, BC). Ela envia
# consultas/baixar/<nome>.txt com URLs e o GitHub devolve os arquivos baixados.
name: Baixar dados

on:
  push:
    paths:
      - "consultas/baixar/*.txt"

permissions:
  contents: write

concurrency:
  group: baixar-dados-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar
        run: |
          pip install requests
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            arquivos=$(git ls-files 'consultas/baixar/*.txt')
          else
            arquivos=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'consultas/baixar/*.txt')
          fi
          for f in $arquivos; do [ -f "$f" ] && python3 scripts/baixar_urls.py "$f"; done
      - name: Commit
        run: |
          git config user.name "diplomacia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add consultas
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Dados baixados [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
