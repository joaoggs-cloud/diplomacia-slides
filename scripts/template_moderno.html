<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}} — Diplomacia da Guerra</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout "moderno": formato 4:5 (1080x1350), foto em tela cheia, etiquetas acima do
   título e manchete grande sem serifa — inspirado em perfis de notícia do Instagram. */
:root{
  --w:540px;--h:675px;
  --gold:#e0b84f;--gold-d:#1c1500;--text:#ffffff;--muted:#c9c9c9;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Inter',sans-serif;padding:20px 0 32px;}
.slide{width:var(--w);height:var(--h);background:#000;color:var(--text);position:relative;overflow:hidden;display:none;}
.slide.active{display:block;}
body.export .slide{display:block;margin-bottom:20px;}
body.export .controls{display:none;}

.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.fallback{position:absolute;inset:0;background:radial-gradient(circle at 60% 30%,#2a2a2a,#000 70%);}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 13%,rgba(0,0,0,0) 54%,rgba(0,0,0,0.55) 68%,rgba(0,0,0,0.9) 84%,#000 100%);}
.grad.forte{background:linear-gradient(180deg,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 13%,rgba(0,0,0,0) 46%,rgba(0,0,0,0.6) 60%,rgba(0,0,0,0.92) 76%,#000 100%);}

.logo{position:absolute;top:20px;right:22px;width:96px;z-index:5;filter:brightness(0) invert(1) drop-shadow(0 1px 6px rgba(0,0,0,.6));}
.contador{position:absolute;top:22px;left:22px;z-index:5;font-family:'Inter';font-weight:600;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:12px;}

.corpo{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 26px 18px;text-shadow:0 1px 10px rgba(0,0,0,.55);}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.pill{font-family:'Inter';font-weight:600;font-size:12.5px;padding:5px 9px;border-radius:3px;line-height:1;}
.pill.cat{background:var(--gold);color:var(--gold-d);}
.pill.esc{background:rgba(0,0,0,.6);color:#fff;}
.pill.cla{background:#fff;color:#111;}

.manchete{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;line-height:1.12;letter-spacing:-0.3px;color:#fff;}
.manchete .hl,.manchete .hl2{color:var(--gold);}
.linha-fina{font-family:'Inter';font-weight:500;font-size:15px;line-height:1.45;color:var(--muted);margin-top:10px;}

.titulo{font-family:'Montserrat',sans-serif;font-weight:800;font-size:25px;line-height:1.15;color:#fff;margin-bottom:8px;}
.texto{font-family:'Inter';font-size:14.5px;line-height:1.5;color:#e6e6e6;}
.texto strong{color:#fff;font-weight:700;}
.texto em{color:var(--gold);font-style:normal;font-weight:700;}

.destaque{margin-top:10px;border-left:3px solid var(--gold);padding:7px 11px;background:rgba(0,0,0,.45);}
.destaque .rot{font-family:'Inter';font-weight:700;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
.destaque p{font-family:'Inter';font-size:13.5px;line-height:1.45;color:#ddd;}
.destaque cite{display:block;margin-top:4px;font-style:normal;font-size:12px;color:var(--gold);}
.numero{font-family:'Montserrat';font-weight:800;font-size:46px;line-height:1;color:var(--gold);margin-top:10px;}
.numero-rot{font-family:'Inter';font-size:12px;color:var(--muted);margin-top:2px;}

.rodape{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.marca{display:flex;align-items:center;gap:8px;font-family:'Montserrat';font-weight:700;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#fff;}
.marca::before{content:'';width:2px;height:16px;background:#fff;}
.credito{font-family:'Inter';font-size:9.5px;color:#9a9a9a;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.credito b{color:var(--gold);font-weight:600;}
.setas{font-family:'Montserrat';font-weight:800;font-size:28px;letter-spacing:-3px;color:var(--gold);}

/* Indicadores (notícia de imagem única) */
.grad.noticia{background:linear-gradient(180deg,rgba(0,0,0,0.28) 0%,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 28%,rgba(0,0,0,0.62) 42%,rgba(0,0,0,0.9) 58%,#000 78%);}
.inds{display:flex;gap:8px;margin-top:14px;}
.ind{flex:1;background:rgba(0,0,0,.55);border-top:3px solid var(--gold);padding:8px 10px 9px;}
.ind-v{font-family:'Montserrat';font-weight:800;font-size:22px;line-height:1.05;color:#fff;}
.ind-v.alta{color:#5fd38a;} .ind-v.baixa{color:#ff6b6b;}
.ind-r{font-family:'Inter';font-size:11px;line-height:1.3;color:#cfcfcf;margin-top:4px;}

/* Mini gráficos */
.ind.graf{display:flex;flex-direction:column;padding:8px 10px 8px;}
.g-tit{font-family:'Inter';font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#fff;margin-bottom:6px;}
.g-barras{display:flex;align-items:flex-end;gap:10px;height:104px;}
.g-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;}
.g-val{font-family:'Montserrat';font-weight:800;font-size:13px;color:#fff;margin-bottom:3px;white-space:nowrap;}
.g-bar{width:100%;max-width:34px;background:#8a8a8a;border-radius:4px 4px 0 0;}
.g-bar.dest{background:var(--gold);}
.g-rot{font-family:'Inter';font-size:9.5px;color:#cfcfcf;margin-top:4px;text-align:center;line-height:1.2;}
.g-faixa-val{font-family:'Montserrat';font-weight:800;font-size:22px;color:#fff;margin:16px 0 10px;}
.g-trilho{position:relative;height:16px;background:rgba(255,255,255,.12);border-radius:3px;}
.g-solido{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px 0 0 3px;}
.g-incerto{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--gold) 0 3px,transparent 3px 6px);}
.g-escala{display:flex;justify-content:space-between;font-family:'Inter';font-size:9.5px;color:#aaa;margin-top:4px;}
.g-num{font-family:'Montserrat';font-weight:800;font-size:24px;color:#fff;margin:22px 0 4px;}
.g-nota{font-family:'Inter';font-size:9.5px;line-height:1.3;color:#bdbdbd;margin-top:auto;padding-top:6px;}

/* Gráfico em slide de conteúdo */
.inds.grande{margin-top:12px;}
.inds.grande .ind{padding:10px 12px 10px;}
.inds.grande .g-barras{height:120px;gap:28px;justify-content:center;}
.inds.grande .g-bar{max-width:56px;}
.inds.grande .g-val{font-size:16px;}
.inds.grande .g-rot{font-size:11px;}
.r-trilho{position:relative;height:84px;margin:6px 18px 4px;border-bottom:3px solid rgba(255,255,255,.25);}
.r-marca{position:absolute;bottom:-3px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.r-val{font-family:'Montserrat';font-weight:800;font-size:14px;color:#fff;white-space:nowrap;}
.r-marca.dest .r-val{color:var(--gold);font-size:16px;}
.r-pino{width:3px;height:22px;background:#8a8a8a;margin:3px 0 0;}
.r-marca.dest .r-pino{background:var(--gold);height:30px;}
.r-rot{position:absolute;top:100%;margin-top:6px;font-family:'Inter';font-size:9.5px;line-height:1.2;color:#cfcfcf;text-align:center;width:74px;}
.r-marca:last-child .r-rot{text-align:right;right:-6px;}
.r-marca:first-child .r-rot{text-align:left;left:-6px;}
.ind:has(.r-trilho){padding-bottom:46px;}
.t-lista{display:flex;flex-direction:column;gap:7px;}
.t-item{display:flex;gap:10px;align-items:baseline;border-left:3px solid var(--gold);padding-left:9px;}
.t-hora{font-family:'Montserrat';font-weight:800;font-size:12.5px;color:var(--gold);min-width:92px;}
.t-txt{font-family:'Inter';font-size:13px;line-height:1.35;color:#eee;}

/* CTA */
.cta{background:radial-gradient(circle at 50% 35%,#1f1a0c 0%,#000 70%);}
.cta .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;}
.cta-logo{width:210px;margin-bottom:26px;}
.cta-h{font-family:'Montserrat';font-weight:800;font-size:30px;line-height:1.15;color:#fff;}
.cta-sub{font-family:'Inter';font-size:15px;color:var(--muted);margin-top:10px;}
.cta-btn{margin-top:26px;font-family:'Inter';font-weight:700;font-size:15px;color:var(--gold-d);background:var(--gold);padding:10px 18px;border-radius:22px;}

.controls{display:flex;align-items:center;gap:12px;margin-top:16px;}
.btn{background:#1a1a1a;border:1px solid #333;color:#999;padding:9px 18px;cursor:pointer;font-family:'Inter';font-size:13px;}
.counter{color:#777;font-size:12px;min-width:56px;text-align:center;font-family:'Inter';}
</style>
</head>
<body>
<div id="carousel">
{{SLIDES}}
</div>
<div class="controls">
  <button class="btn" onclick="show(cur-1)">← Anterior</button>
  <span class="counter" id="ctr"></span>
  <button class="btn" onclick="show(cur+1)">Próximo →</button>
</div>
<script>
let cur=0;
const slides=document.querySelectorAll('.slide');
function show(n){slides.forEach(s=>s.classList.remove('active'));cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');document.getElementById('ctr').textContent=(cur+1)+' / '+slides.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(0);
</script>
</body>
</html>
