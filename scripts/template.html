<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}} — Diplomacia da Guerra</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--bg3:#1a1a1a;--text:#f0ead6;--muted:#7a7060;
  --green:#8b9e6e;--gold:#c4a951;--border:#2e2e2e;--sz:540px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Barlow Condensed',sans-serif;padding:20px 0 32px;}
.slide{width:var(--sz);height:var(--sz);background:var(--bg);color:var(--text);position:relative;overflow:hidden;display:none;flex-direction:column;}
.slide.active{display:flex;}
body.export .slide{display:flex;margin-bottom:20px;}
body.export .controls{display:none;}
.wm{position:absolute;top:38px;left:16px;width:84px;opacity:0.9;pointer-events:none;z-index:20;}
.fallback{position:absolute;inset:0;background:
  repeating-linear-gradient(45deg,#141414 0 2px,transparent 2px 14px),
  radial-gradient(circle at 70% 30%,#1d2616,#0a0a0a 70%);}
.credit{position:absolute;bottom:6px;right:10px;font-size:8px;letter-spacing:.5px;color:rgba(240,234,214,.55);z-index:3;max-width:70%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.capa-credit{bottom:8px;}

/* CAPA */
.capa{position:relative;background:#050505;}
.capa-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(0.75) saturate(0.85);z-index:0;}
.capa-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,0.1) 0%,rgba(5,5,5,0.75) 55%,rgba(5,5,5,0.92) 100%);z-index:1;}
.capa-body{position:relative;z-index:2;padding:0 38px 38px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
.capa-tag{font-size:10px;font-weight:600;letter-spacing:5px;color:var(--green);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.capa-tag::before{content:'';width:24px;height:1px;background:var(--green);}
.capa-title{font-family:'Oswald',sans-serif;font-size:44px;font-weight:700;text-transform:uppercase;line-height:0.97;letter-spacing:1px;color:var(--text);margin-bottom:20px;}
.capa-title .hl{color:var(--green);}
.capa-title .hl2{color:var(--gold);}
.capa-hook{font-size:15px;color:#9a9080;line-height:1.55;max-width:420px;border-left:3px solid var(--gold);padding-left:14px;}
.capa-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--green),var(--gold) 60%,transparent);z-index:3;}

/* SLIDES DE CONTEÚDO */
.s-photo{height:210px;overflow:hidden;flex-shrink:0;position:relative;}
.s-photo img{width:100%;height:100%;object-fit:cover;filter:brightness(0.72) saturate(0.8);display:block;}
.s-photo-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,#0a0a0a 100%);}
.s-photo-num{position:absolute;top:12px;left:16px;font-family:'Bebas Neue',sans-serif;font-size:12px;color:var(--gold);letter-spacing:3px;background:rgba(0,0,0,0.78);padding:3px 9px;z-index:2;}
.s-photo-tag{position:absolute;top:12px;right:16px;font-size:9px;letter-spacing:4px;color:#999;text-transform:uppercase;background:rgba(0,0,0,0.78);padding:3px 9px;z-index:2;}
.s-content{padding:14px 30px 16px;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.s-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text);line-height:1.1;margin-bottom:7px;}
.s-div{width:28px;height:3px;background:var(--green);margin-bottom:9px;}
.s-body{font-size:15px;line-height:1.55;color:#ccc4b0;}
.s-body strong{color:var(--text);font-weight:600;}
.s-body em{color:var(--gold);font-style:normal;font-weight:600;}
.s-footer{border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.s-pn{font-size:9px;letter-spacing:3px;color:#404040;text-transform:uppercase;}
.s-handle{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:#5a5240;}

.hn{font-family:'Bebas Neue',sans-serif;font-size:58px;color:var(--gold);line-height:1;margin:3px 0 1px;}
.hlabel{font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
.fb{background:var(--bg3);border-left:4px solid var(--green);padding:9px 13px;margin:7px 0;}
.fb .ft{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:4px;color:var(--green);text-transform:uppercase;margin-bottom:4px;}
.fb p{font-size:13px;color:#bbb5a0;line-height:1.4;}
blockquote{border-left:4px solid var(--green);padding:9px 13px;background:var(--bg3);font-size:14px;color:var(--text);line-height:1.5;margin:7px 0;}
blockquote cite{display:block;margin-top:6px;font-size:11px;font-style:normal;color:var(--gold);letter-spacing:1px;}

/* NOTÍCIA (imagem única) */
.noticia{background:#050505;}
.n-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(0.55) saturate(0.7);}
.n-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,0.35) 0%,rgba(5,5,5,0.7) 45%,rgba(5,5,5,0.95) 100%);}
.n-body{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 36px 30px;}
.n-tag{align-self:flex-start;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:#0a0a0a;background:var(--gold);padding:5px 10px;margin-bottom:14px;}
.n-title{font-family:'Oswald',sans-serif;font-size:40px;font-weight:700;text-transform:uppercase;line-height:1;color:var(--text);margin-bottom:18px;}
.n-title .hl{color:var(--green);} .n-title .hl2{color:var(--gold);}
.n-placar{display:flex;gap:12px;margin-bottom:16px;}
.n-cand{flex:1;background:rgba(20,20,20,0.85);border-top:3px solid var(--text);padding:10px 14px 12px;}
.n-pct{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:1;color:var(--text);}
.n-nome{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;text-transform:uppercase;color:var(--text);margin-top:4px;}
.n-partido{font-size:12px;letter-spacing:3px;color:#9a9080;text-transform:uppercase;}
.n-sub{font-size:14px;line-height:1.5;color:#bdb5a0;border-left:3px solid var(--gold);padding-left:12px;margin-bottom:16px;}
.n-sub strong{color:var(--text);}
.n-foot{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:9px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6a6252;}
.n-handle{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--gold);letter-spacing:2px;}
.n-logo{position:absolute;top:22px;right:22px;width:78px;opacity:0.9;z-index:3;}

/* CTA */
.cta{background:linear-gradient(150deg,#0b1808 0%,#080808 100%);justify-content:center;align-items:center;text-align:center;padding:40px;}
.cta-b1{position:absolute;inset:18px;border:1px solid #1e2a18;pointer-events:none;}
.cta-b2{position:absolute;inset:25px;border:1px solid #141e10;pointer-events:none;}
.cta-logo{width:240px;margin-bottom:14px;}
.cta-div{width:48px;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);margin:12px auto;}
.cta-h{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:6px;color:var(--text);margin-bottom:6px;}
.cta-sub{font-size:12px;letter-spacing:4px;color:var(--green);text-transform:uppercase;}
.cta-handle{margin-top:18px;font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--gold);letter-spacing:3px;}

.controls{display:flex;align-items:center;gap:12px;margin-top:16px;}
.btn{background:#1a1a1a;border:1px solid #333;color:#999;padding:9px 18px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.btn:hover{background:#242424;border-color:var(--green);color:#fff;}
.counter{color:#555;font-size:12px;letter-spacing:3px;min-width:56px;text-align:center;font-family:'Bebas Neue',sans-serif;}
</style>
</head>
<body>
<div id="carousel">
{{SLIDES}}
</div>
<div class="controls">
  <button class="btn" onclick="show(cur-1)">← Anterior</button>
  <span class="counter" id="ctr"></span>
  <button class="btn" onclick="show(cur+1)">Próximo →</button>
</div>
<script>
let cur=0;
const slides=document.querySelectorAll('.slide');
function show(n){slides.forEach(s=>s.classList.remove('active'));cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');document.getElementById('ctr').textContent=(cur+1)+' / '+slides.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
show(0);
</script>
</body>
</html>
